name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, testes e verificação de cobertura (>= 80% no domínio)
        run: mvn -B verify
      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy - análise de vulnerabilidades (dependências e configuração)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          output: trivy-report.txt
          exit-code: '0'
      - name: Publicar relatório
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
