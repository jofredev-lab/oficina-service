spring.application.name=oficina-service
server.port=8080

# Banco de dados (PostgreSQL). Valores sobrescritos por variáveis de ambiente no docker-compose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oficina}
spring.datasource.username=${DB_USER:oficina}
spring.datasource.password=${DB_PASSWORD:oficina}

# MVP: o schema é gerado/atualizado pelo Hibernate. Próxima fase: migrar para Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Segurança (JWT) - em produção defina JWT_SECRET (mínimo 32 caracteres) e ADMIN_PASSWORD
app.security.jwt.secret=${JWT_SECRET:demo-secret-key-troque-em-producao-0123456789}
app.security.jwt.expiration-seconds=3600
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin123}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
